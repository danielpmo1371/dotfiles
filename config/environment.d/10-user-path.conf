# PATH for every systemd user service: claude-rc, claude-rc-sessions (and the
# tmux server rc-start.sh forks), claude-task timers. Without it they get the
# manager's bare PATH, which lacks ~/.local/bin (claude) and ~/bin (rc-*.sh).
# Read by systemd's environment.d generator on daemon-reload / login; see
# environment.d(5). Secrets do NOT belong here: services read them via
# `zsh -lic` or the keychain. Linked by installers/services.sh.
PATH=$HOME/.local/bin:$HOME/bin:${PATH}
