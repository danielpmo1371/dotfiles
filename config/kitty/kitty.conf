# Kitty configuration (Linux / Hyprland)
#
# Terminal-agnostic layering (see CLAUDE.md): behaviour lives in tmux/shell;
# the emulator owns only rendering and OS integration. The macOS ghostty
# config forwards super+<key> as control codes because macOS swallows cmd;
# on this machine that job is done at the XKB layer instead
# (ctrl:swap_lalt_lctl in config/hypr/hyprland.lua — Ctrl on the thumb key),
# so no key-forwarding table is needed here. Super belongs to Hyprland.
#
# Kitty's default shortcuts (ctrl+shift+c/v copy/paste, ctrl+shift+equal/minus
# font size, etc.) are deliberately kept — with the swap they land on
# thumb+shift, matching cmd+shift muscle memory.

# Nerd Font for Powerlevel10k glyphs (installed by ./install.sh --fonts)
font_family MesloLGS NF

cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0
detect_urls yes
strip_trailing_spaces always
mouse_hide_wait -1

# Window padding (in pts)
window_padding_width 0

# tmux's terminal-overrides advertises RGB for xterm-256color, and it is the
# safe TERM over SSH to hosts without kitty terminfo.
term xterm-256color

# Scrollback navigation (outside tmux; tmux owns its own scrollback)
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end
