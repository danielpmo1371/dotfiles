# Installed to /etc/systemd/system/user@.service.d/ by installers/memwatch.sh.
#
# When memory pressure in the user manager stays above the limit for
# systemd-oomd's DefaultMemoryPressureDurationSec (20s), oomd SIGKILLs the leaf
# cgroup under it with the most reclaim activity: in practice the one tmux pane
# (tmux-spawn-*.scope) or app scope that is eating memory, instead of the whole
# desktop freezing until the kernel OOM killer fires minutes later.
# Hyprland runs in session-N.scope, outside user@.service, so it is never a
# candidate. 40% is the value systemd-oomd.service(8) suggests for user@$UID.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=40%
