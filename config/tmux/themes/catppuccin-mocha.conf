# catppuccin-mocha - palette: Catppuccin Mocha - github.com/catppuccin/palette (palette.json)
# Every file in this directory sets the same options (tests/test-tmux-theme.sh
# pins it), so switching themes leaves nothing behind. Applied by
# util-scripts/tmux-theme.sh; status-right must keep continuum_save.sh.

# status-bg/status-fg first: older tmux folds them into status-style.
set -g status-bg 'default'
set -g status-fg 'default'
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left '#[bg=#cba6f7,fg=#11111b] #S #[bg=#181825,fg=#cba6f7,nobold,noitalics,nounderscore]'
set -g status-left-style 'none'
set -g status-left-length '80'
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#313244,fg=#45475a,nobold,noitalics,nounderscore]#[bg=#45475a,fg=#cdd6f4]#[range=user|power] #{?@power_weather,#(~/repos/dotfiles/util-scripts/tmux-weather.sh),#(~/repos/dotfiles/util-scripts/tmux-battery.sh)} #[norange]#[bg=#313244,fg=#45475a,nobold,noitalics,nounderscore]#[bg=#45475a,fg=#cdd6f4]#[range=user|bluetooth] 󰂯 #[norange]#[bg=#313244,fg=#45475a,nobold,noitalics,nounderscore]#[bg=#45475a,fg=#cdd6f4]#[range=user|datetime] #{?@datetime_collapsed,󰥔,%d/%m %a %H:%M} #[norange]#[bg=#313244,fg=#45475a,nobold,noitalics,nounderscore]#[bg=#45475a,fg=#cdd6f4] #h'
set -g status-right-style 'none'
set -g status-right-length '80'
set -g status-justify 'left'
set -g window-status-style 'bg=#89b4fa,fg=#181825'
set -g window-status-current-style 'bg=#89b4fa,fg=#181825'
set -g window-status-activity-style 'bg=#181825,fg=#f9e2af'
set -g window-status-bell-style 'bg=#f38ba8,fg=#11111b'
set -g window-status-format '#[bg=#313244,fg=#181825,noitalics]#[bg=#313244,fg=#cdd6f4] #I #[bg=#313244,fg=#cdd6f4] #W #{?window_end_flag,#[bg=#181825],#[bg=#181825]}#[fg=#313244,noitalics]'
set -g window-status-current-format '#[bg=#89b4fa,fg=#181825,nobold,noitalics,nounderscore]#[bg=#89b4fa,fg=#11111b] #I #[bg=#89b4fa,fg=#11111b,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#181825],#[bg=#181825]}#[fg=#89b4fa,nobold,noitalics,nounderscore]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7,bg=default'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g message-command-style 'bg=#cba6f7,fg=#11111b'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'
set -g display-panes-colour '#313244'
set -g display-panes-active-colour '#cba6f7'
set -g clock-mode-colour '#89b4fa'
