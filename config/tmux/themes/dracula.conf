# dracula - palette: Dracula - spec.draculatheme.com
# Every file in this directory sets the same options (tests/test-tmux-theme.sh
# pins it), so switching themes leaves nothing behind. Applied by
# util-scripts/tmux-theme.sh; status-right must keep continuum_save.sh.

# status-bg/status-fg first: older tmux folds them into status-style.
set -g status-bg 'default'
set -g status-fg 'default'
set -g status-style 'bg=#282a36,fg=#f8f8f2'
set -g status-left '#[bg=#bd93f9,fg=#282a36] #S #[bg=#282a36,fg=#bd93f9,nobold,noitalics,nounderscore]'
set -g status-left-style 'none'
set -g status-left-length '80'
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#44475a,fg=#6272a4,nobold,noitalics,nounderscore]#[bg=#6272a4,fg=#f8f8f2] #(~/repos/dotfiles/util-scripts/tmux-battery.sh) #[bg=#44475a,fg=#6272a4,nobold,noitalics,nounderscore]#[bg=#6272a4,fg=#f8f8f2]#[range=user|datetime] #{?@datetime_collapsed,󰥔,%d/%m %a %H:%M} #[norange]#[bg=#44475a,fg=#6272a4,nobold,noitalics,nounderscore]#[bg=#6272a4,fg=#f8f8f2] #h'
set -g status-right-style 'none'
set -g status-right-length '80'
set -g status-justify 'left'
set -g window-status-style 'bg=#ff79c6,fg=#282a36'
set -g window-status-current-style 'bg=#ff79c6,fg=#282a36'
set -g window-status-activity-style 'bg=#282a36,fg=#f1fa8c'
set -g window-status-bell-style 'bg=#ff5555,fg=#282a36'
set -g window-status-format '#[bg=#44475a,fg=#282a36,noitalics]#[bg=#44475a,fg=#f8f8f2] #I #[bg=#44475a,fg=#f8f8f2] #W #{?window_end_flag,#[bg=#282a36],#[bg=#282a36]}#[fg=#44475a,noitalics]'
set -g window-status-current-format '#[bg=#ff79c6,fg=#282a36,nobold,noitalics,nounderscore]#[bg=#ff79c6,fg=#282a36] #I #[bg=#ff79c6,fg=#282a36,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#282a36],#[bg=#282a36]}#[fg=#ff79c6,nobold,noitalics,nounderscore]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#bd93f9,bg=default'
set -g message-style 'bg=#44475a,fg=#f8f8f2'
set -g message-command-style 'bg=#bd93f9,fg=#282a36'
set -g mode-style 'bg=#44475a,fg=#f8f8f2'
set -g display-panes-colour '#44475a'
set -g display-panes-active-colour '#bd93f9'
set -g clock-mode-colour '#bd93f9'
