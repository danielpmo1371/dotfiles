# gruvbox-dark - palette: live capture of egel/tmux-gruvbox dark (morhetz/gruvbox colours) - github.com/morhetz/gruvbox
# Every file in this directory sets the same options (tests/test-tmux-theme.sh
# pins it), so switching themes leaves nothing behind. Applied by
# util-scripts/tmux-theme.sh; status-right must keep continuum_save.sh.

# status-bg/status-fg first: older tmux folds them into status-style.
set -g status-bg '#262626'
set -g status-fg '#626262'
set -g status-style 'bg=#3c3836,fg=#ebdbb2'
set -g status-left '#[bg=#665c54,fg=#bdae93] #S #[bg=#3c3836,fg=#665c54,nobold,noitalics,nounderscore]'
set -g status-left-style 'none'
set -g status-left-length '80'
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#504945,fg=#bdae93,nobold,noitalics,nounderscore]#[bg=#bdae93,fg=#3c3836]#[range=user|power] #{?@power_weather,#(~/repos/dotfiles/util-scripts/tmux-weather.sh),#(~/repos/dotfiles/util-scripts/tmux-battery.sh)} #[norange]#[bg=#504945,fg=#bdae93,nobold,noitalics,nounderscore]#[bg=#bdae93,fg=#3c3836]#[range=user|bluetooth] 󰂯 #[norange]#[bg=#504945,fg=#bdae93,nobold,noitalics,nounderscore]#[bg=#bdae93,fg=#3c3836]#[range=user|datetime] #{?@datetime_collapsed,󰥔,%d/%m %a %H:%M} #[norange]#[bg=#504945,fg=#bdae93,nobold,noitalics,nounderscore]#[bg=#bdae93,fg=#3c3836] #h'
set -g status-right-style 'none'
set -g status-right-length '80'
set -g status-justify 'left'
set -g window-status-style 'bg=#fabd2f,fg=#3c3836'
set -g window-status-current-style 'bg=#fabd2f,fg=#3c3836'
set -g window-status-activity-style 'bg=#3c3836,fg=#bdae93'
set -g window-status-bell-style 'bg=#fb4934,fg=#282828'
set -g window-status-format '#[bg=#504945,fg=#3c3836,noitalics]#[bg=#504945,fg=#ebdbb2] #I #[bg=#504945,fg=#ebdbb2] #W #{?window_end_flag,#[bg=#3c3836],#[bg=#3c3836]}#[fg=#504945,noitalics]'
set -g window-status-current-format '#[bg=#fabd2f,fg=#3c3836,nobold,noitalics,nounderscore]#[bg=#fabd2f,fg=#504945] #I #[bg=#fabd2f,fg=#504945,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#3c3836],#[bg=#3c3836]}#[fg=#fabd2f,nobold,noitalics,nounderscore]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=colour208,bg=default'
set -g message-style 'bg=#504945,fg=#ebdbb2'
set -g message-command-style 'bg=#bdae93,fg=#3c3836'
# mode-style: tmux's own default, which is what egel/tmux-gruvbox left in place.
set -gu mode-style
set -g display-panes-colour '#3c3836'
set -g display-panes-active-colour '#d5c4a1'
set -g clock-mode-colour '#83a598'
