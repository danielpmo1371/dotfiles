# gruvbox-light - palette: morhetz/gruvbox light - github.com/morhetz/gruvbox (roles as egel/tmux-gruvbox light)
# Every file in this directory sets the same options (tests/test-tmux-theme.sh
# pins it), so switching themes leaves nothing behind. Applied by
# util-scripts/tmux-theme.sh; status-right must keep continuum_save.sh.

# status-bg/status-fg first: older tmux folds them into status-style.
set -g status-bg 'default'
set -g status-fg 'default'
set -g status-style 'bg=#ebdbb2,fg=#3c3836'
set -g status-left '#[bg=#bdae93,fg=#665c54] #S #[bg=#ebdbb2,fg=#bdae93,nobold,noitalics,nounderscore]'
set -g status-left-style 'none'
set -g status-left-length '80'
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#d5c4a1,fg=#665c54,nobold,noitalics,nounderscore]#[bg=#665c54,fg=#ebdbb2]#[range=user|power] #{?@power_weather,#(~/repos/dotfiles/util-scripts/tmux-weather.sh),#(~/repos/dotfiles/util-scripts/tmux-battery.sh)} #[norange]#[bg=#d5c4a1,fg=#665c54,nobold,noitalics,nounderscore]#[bg=#665c54,fg=#ebdbb2]#[range=user|bluetooth] 󰂯 #[norange]#[bg=#d5c4a1,fg=#665c54,nobold,noitalics,nounderscore]#[bg=#665c54,fg=#ebdbb2]#[range=user|datetime] #{?@datetime_collapsed,󰥔,%d/%m %a %H:%M} #[norange]#[bg=#d5c4a1,fg=#665c54,nobold,noitalics,nounderscore]#[bg=#665c54,fg=#ebdbb2] #h'
set -g status-right-style 'none'
set -g status-right-length '80'
set -g status-justify 'left'
set -g window-status-style 'bg=#b57614,fg=#ebdbb2'
set -g window-status-current-style 'bg=#b57614,fg=#ebdbb2'
set -g window-status-activity-style 'bg=#ebdbb2,fg=#665c54'
set -g window-status-bell-style 'bg=#9d0006,fg=#fbf1c7'
set -g window-status-format '#[bg=#d5c4a1,fg=#ebdbb2,noitalics]#[bg=#d5c4a1,fg=#3c3836] #I #[bg=#d5c4a1,fg=#3c3836] #W #{?window_end_flag,#[bg=#ebdbb2],#[bg=#ebdbb2]}#[fg=#d5c4a1,noitalics]'
set -g window-status-current-format '#[bg=#b57614,fg=#ebdbb2,nobold,noitalics,nounderscore]#[bg=#b57614,fg=#d5c4a1] #I #[bg=#b57614,fg=#d5c4a1,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#ebdbb2],#[bg=#ebdbb2]}#[fg=#b57614,nobold,noitalics,nounderscore]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#ebdbb2'
set -g pane-active-border-style 'fg=#af3a03,bg=default'
set -g message-style 'bg=#d5c4a1,fg=#3c3836'
set -g message-command-style 'bg=#665c54,fg=#ebdbb2'
set -g mode-style 'bg=#b57614,fg=#fbf1c7'
set -g display-panes-colour '#ebdbb2'
set -g display-panes-active-colour '#504945'
set -g clock-mode-colour '#076678'
