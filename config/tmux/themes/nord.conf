# nord - palette: Nord - nordtheme.com (github.com/nordtheme/nord src/nord.css)
# Every file in this directory sets the same options (tests/test-tmux-theme.sh
# pins it), so switching themes leaves nothing behind. Applied by
# util-scripts/tmux-theme.sh; status-right must keep continuum_save.sh.

# status-bg/status-fg first: older tmux folds them into status-style.
set -g status-bg 'default'
set -g status-fg 'default'
set -g status-style 'bg=#3b4252,fg=#d8dee9'
set -g status-left '#[bg=#88c0d0,fg=#2e3440] #S #[bg=#3b4252,fg=#88c0d0,nobold,noitalics,nounderscore]'
set -g status-left-style 'none'
set -g status-left-length '80'
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#434c5e,fg=#4c566a,nobold,noitalics,nounderscore]#[bg=#4c566a,fg=#eceff4] #(~/repos/dotfiles/util-scripts/tmux-battery.sh) #[bg=#434c5e,fg=#4c566a,nobold,noitalics,nounderscore]#[bg=#4c566a,fg=#eceff4]#[range=user|datetime] #{?@datetime_collapsed,󰥔,%d/%m %a %H:%M} #[norange]#[bg=#434c5e,fg=#4c566a,nobold,noitalics,nounderscore]#[bg=#4c566a,fg=#eceff4] #h'
set -g status-right-style 'none'
set -g status-right-length '80'
set -g status-justify 'left'
set -g window-status-style 'bg=#81a1c1,fg=#3b4252'
set -g window-status-current-style 'bg=#81a1c1,fg=#3b4252'
set -g window-status-activity-style 'bg=#3b4252,fg=#ebcb8b'
set -g window-status-bell-style 'bg=#bf616a,fg=#2e3440'
set -g window-status-format '#[bg=#434c5e,fg=#3b4252,noitalics]#[bg=#434c5e,fg=#d8dee9] #I #[bg=#434c5e,fg=#d8dee9] #W #{?window_end_flag,#[bg=#3b4252],#[bg=#3b4252]}#[fg=#434c5e,noitalics]'
set -g window-status-current-format '#[bg=#81a1c1,fg=#3b4252,nobold,noitalics,nounderscore]#[bg=#81a1c1,fg=#2e3440] #I #[bg=#81a1c1,fg=#2e3440,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#3b4252],#[bg=#3b4252]}#[fg=#81a1c1,nobold,noitalics,nounderscore]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#434c5e'
set -g pane-active-border-style 'fg=#88c0d0,bg=default'
set -g message-style 'bg=#434c5e,fg=#eceff4'
set -g message-command-style 'bg=#88c0d0,fg=#2e3440'
set -g mode-style 'bg=#4c566a,fg=#eceff4'
set -g display-panes-colour '#434c5e'
set -g display-panes-active-colour '#88c0d0'
set -g clock-mode-colour '#88c0d0'
