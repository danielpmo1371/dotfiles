# rose-pine - palette: Rose Pine (main) - rosepinetheme.com (github.com/rose-pine/palette palette.json)
# Every file in this directory sets the same options (tests/test-tmux-theme.sh
# pins it), so switching themes leaves nothing behind. Applied by
# util-scripts/tmux-theme.sh; status-right must keep continuum_save.sh.

# status-bg/status-fg first: older tmux folds them into status-style.
set -g status-bg 'default'
set -g status-fg 'default'
set -g status-style 'bg=#1f1d2e,fg=#e0def4'
set -g status-left '#[bg=#c4a7e7,fg=#191724] #S #[bg=#1f1d2e,fg=#c4a7e7,nobold,noitalics,nounderscore]'
set -g status-left-style 'none'
set -g status-left-length '80'
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#26233a,fg=#403d52,nobold,noitalics,nounderscore]#[bg=#403d52,fg=#e0def4] #(~/repos/dotfiles/util-scripts/tmux-battery.sh) #[bg=#26233a,fg=#403d52,nobold,noitalics,nounderscore]#[bg=#403d52,fg=#e0def4]#[range=user|datetime] #{?@datetime_collapsed,󰥔,%d/%m %a %H:%M} #[norange]#[bg=#26233a,fg=#403d52,nobold,noitalics,nounderscore]#[bg=#403d52,fg=#e0def4] #h'
set -g status-right-style 'none'
set -g status-right-length '80'
set -g status-justify 'left'
set -g window-status-style 'bg=#ebbcba,fg=#1f1d2e'
set -g window-status-current-style 'bg=#ebbcba,fg=#1f1d2e'
set -g window-status-activity-style 'bg=#1f1d2e,fg=#f6c177'
set -g window-status-bell-style 'bg=#eb6f92,fg=#191724'
set -g window-status-format '#[bg=#26233a,fg=#1f1d2e,noitalics]#[bg=#26233a,fg=#e0def4] #I #[bg=#26233a,fg=#e0def4] #W #{?window_end_flag,#[bg=#1f1d2e],#[bg=#1f1d2e]}#[fg=#26233a,noitalics]'
set -g window-status-current-format '#[bg=#ebbcba,fg=#1f1d2e,nobold,noitalics,nounderscore]#[bg=#ebbcba,fg=#191724] #I #[bg=#ebbcba,fg=#191724,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#1f1d2e],#[bg=#1f1d2e]}#[fg=#ebbcba,nobold,noitalics,nounderscore]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#26233a'
set -g pane-active-border-style 'fg=#c4a7e7,bg=default'
set -g message-style 'bg=#26233a,fg=#e0def4'
set -g message-command-style 'bg=#c4a7e7,fg=#191724'
set -g mode-style 'bg=#403d52,fg=#e0def4'
set -g display-panes-colour '#26233a'
set -g display-panes-active-colour '#ebbcba'
set -g clock-mode-colour '#9ccfd8'
