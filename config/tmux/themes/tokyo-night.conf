# tokyo-night - palette: Tokyo Night (night) - github.com/folke/tokyonight.nvim (lua/tokyonight/colors/night.lua + storm.lua)
# Every file in this directory sets the same options (tests/test-tmux-theme.sh
# pins it), so switching themes leaves nothing behind. Applied by
# util-scripts/tmux-theme.sh; status-right must keep continuum_save.sh.

# status-bg/status-fg first: older tmux folds them into status-style.
set -g status-bg 'default'
set -g status-fg 'default'
set -g status-style 'bg=#16161e,fg=#c0caf5'
set -g status-left '#[bg=#7aa2f7,fg=#16161e] #S #[bg=#16161e,fg=#7aa2f7,nobold,noitalics,nounderscore]'
set -g status-left-style 'none'
set -g status-left-length '80'
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#292e42,fg=#3b4261,nobold,noitalics,nounderscore]#[bg=#3b4261,fg=#c0caf5] #(~/repos/dotfiles/util-scripts/tmux-battery.sh) #[bg=#292e42,fg=#3b4261,nobold,noitalics,nounderscore]#[bg=#3b4261,fg=#c0caf5] %d/%m %a %H:%M #[bg=#292e42,fg=#3b4261,nobold,noitalics,nounderscore]#[bg=#3b4261,fg=#c0caf5] #h'
set -g status-right-style 'none'
set -g status-right-length '80'
set -g status-justify 'left'
set -g window-status-style 'bg=#bb9af7,fg=#16161e'
set -g window-status-current-style 'bg=#bb9af7,fg=#16161e'
set -g window-status-activity-style 'bg=#16161e,fg=#e0af68'
set -g window-status-bell-style 'bg=#f7768e,fg=#16161e'
set -g window-status-format '#[bg=#292e42,fg=#16161e,noitalics]#[bg=#292e42,fg=#a9b1d6] #I #[bg=#292e42,fg=#a9b1d6] #W #{?window_end_flag,#[bg=#16161e],#[bg=#16161e]}#[fg=#292e42,noitalics]'
set -g window-status-current-format '#[bg=#bb9af7,fg=#16161e,nobold,noitalics,nounderscore]#[bg=#bb9af7,fg=#16161e] #I #[bg=#bb9af7,fg=#16161e,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#16161e],#[bg=#16161e]}#[fg=#bb9af7,nobold,noitalics,nounderscore]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7,bg=default'
set -g message-style 'bg=#292e42,fg=#c0caf5'
set -g message-command-style 'bg=#7aa2f7,fg=#16161e'
set -g mode-style 'bg=#3d59a1,fg=#c0caf5'
set -g display-panes-colour '#3b4261'
set -g display-panes-active-colour '#7aa2f7'
set -g clock-mode-colour '#7aa2f7'
