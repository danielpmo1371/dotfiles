############################################
# TMUX Configuration with TPM and Plugins #
############################################

# ==========================
# General Settings
# ==========================

# Use Ctrl+e as prefix (based on running config)
set -g prefix C-e
unbind C-b
bind C-e send-prefix

# Enable mouse support
set -g mouse on

# Click the session name in the status bar to open the session picker (same as prefix+s)
bind -n MouseDown1StatusLeft choose-tree -Zs

# Set default terminal
set -g default-terminal "tmux-256color"

# Enable true color support
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable image passthrough for Kitty graphics protocol
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Increase history limit
set -g history-limit 50000

# Keep more server messages (prefix+~): continuum polls options every few
# seconds and floods the default 1000-line log within a minute.
set -g message-limit 10000

# No delay for escape key
set -g escape-time 0

# Disable Ctrl+d detach (conflicts with vim navigation)
unbind -n C-d

# Enable focus events
set -g focus-events on

# Extended keys (xterm modifyOtherKeys): lets tmux see Ctrl+digit and other
# combos that have no legacy control byte (e.g. C-1). tmux does not auto-detect
# the feature for Ghostty, so opt the TERM it presents in explicitly.
set -s extended-keys on
set -as terminal-features 'xterm-256color:extkeys'

# Increase display time
set -g display-time 4000

# Status refresh interval
set -g status-interval 1

# Set bar on top
set-option -g status-position top

# ==========================
# Copy Mode & Clipboard
# ==========================

# Vi-style copy keys
set -g mode-keys vi

# Enable clipboard
set -g set-clipboard on

# Copy-mode on prefix C-e ("[" is repurposed for window navigation below)
bind C-e copy-mode

# "]" is taken by window navigation, keep paste-buffer reachable on "v"
bind v paste-buffer

# Scrollback keys, the same ones kitty/Ghostty use for their own scrollback
# outside tmux: S-PPage/S-NPage page, C-S-Up/C-S-Down line, S-Home/C-S-Home top,
# S-End/C-S-End bottom. In a normal pane they enter copy mode (-e: scrolling
# back to the bottom exits it again). A pane on the alternate screen (nvim,
# less, htop) gets the key itself, since it has no tmux history worth scrolling.
# Only the upward keys need a root binding: downward ones have nothing to do
# outside copy mode, so they reach the pane unbound.
bind -n S-PPage   if -F '#{alternate_on}' { send-keys S-PPage }   { copy-mode -eu }
bind -n C-S-Up    if -F '#{alternate_on}' { send-keys C-S-Up }    { copy-mode -e ; send-keys -X scroll-up }
bind -n S-Home    if -F '#{alternate_on}' { send-keys S-Home }    { copy-mode -e ; send-keys -X history-top }
bind -n C-S-Home  if -F '#{alternate_on}' { send-keys C-S-Home }  { copy-mode -e ; send-keys -X history-top }
# Once in copy mode the mode's key table is used instead of root, so bind the
# keys there too (both tables, so they survive a mode-keys change). history-bottom
# never exits copy mode, even with -e, so S-End/C-S-End leave it outright unless
# a selection is present -- the same exception -e itself makes.
bind -T copy-mode-vi S-PPage  send-keys -X page-up
bind -T copy-mode-vi S-NPage  send-keys -X page-down
bind -T copy-mode-vi C-S-Up   send-keys -X scroll-up
bind -T copy-mode-vi C-S-Down send-keys -X scroll-down
bind -T copy-mode-vi S-Home   send-keys -X history-top
bind -T copy-mode-vi C-S-Home send-keys -X history-top
bind -T copy-mode-vi S-End    if -F '#{selection_present}' { send-keys -X history-bottom } { send-keys -X cancel }
bind -T copy-mode-vi C-S-End  if -F '#{selection_present}' { send-keys -X history-bottom } { send-keys -X cancel }
bind -T copy-mode    S-PPage  send-keys -X page-up
bind -T copy-mode    S-NPage  send-keys -X page-down
bind -T copy-mode    C-S-Up   send-keys -X scroll-up
bind -T copy-mode    C-S-Down send-keys -X scroll-down
bind -T copy-mode    S-Home   send-keys -X history-top
bind -T copy-mode    C-S-Home send-keys -X history-top
bind -T copy-mode    S-End    if -F '#{selection_present}' { send-keys -X history-bottom } { send-keys -X cancel }
bind -T copy-mode    C-S-End  if -F '#{selection_present}' { send-keys -X history-bottom } { send-keys -X cancel }

# macOS clipboard integration
if-shell 'uname | grep -q Darwin' {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# WSL clipboard integration
if-shell 'grep -q Microsoft /proc/version' {
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
  bind -T copy-mode     Enter send-keys -X copy-pipe-and-cancel "clip.exe"
  bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "clip.exe"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
}

# Wayland clipboard integration (Linux; also wins on WSLg, where wl-copy works)
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null' {
  bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy"
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
}

# ==========================
# Pane Navigation (Vim-style)
# ==========================

# With prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Without prefix (Ctrl+h,j,k,l)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane splitting with better keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ==========================
# Window Management
# ==========================

# Pane dividers use tmux's defaults; colours come from the theme (config/tmux/themes).
# Custom divider style, kept for reference:
# set -g pane-border-lines double

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Closing a session's last window switches the client to the most recently
# used remaining session instead of detaching (it still exits with the last).
set -g detach-on-destroy off

# Navigate to previous/next window with Cmd+[ and ] (Ghostty sends Shift+Arrow sequences)
bind -n S-Left previous-window
bind -n S-Right next-window

# Navigate to previous/next window with prefix [ and ] (terminal-agnostic)
bind [ previous-window
bind ] next-window

# Move window left/right with Cmd+Shift+[ and ] (Ghostty sends Ctrl+Shift+Arrow sequences)
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# Switch sessions with Cmd+Shift+j/k (Ghostty sends Shift+Arrow sequences)
bind -n S-Down switch-client -n
bind -n S-Up switch-client -p

# ==========================
# Pop ups
# ==========================

# Help & Ask Claude menu (Cmd+e ?)
bind ? run-shell "~/repos/dotfiles/util-scripts/tmux-ask-menu.sh"

# Scratch pad popup toggle (Ctrl+a, or prefix+Ctrl+n / prefix+q)
bind -n C-q run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"
bind C-n run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"
bind q run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"

# Claude pane picker - fzf list of running Claudes with a live pane preview and vi modes,
# styled like the tmux-palette Ctrl+P menu; Enter jumps to the pane (Cmd+e Cmd+i / Cmd+e i).
# --popup opens the borderless, centred popup itself (its body colour comes from the
# palette's active theme, which a static display-popup -s here could not follow).
bind C-i run-shell "~/repos/dotfiles/util-scripts/tmux-claude-picker.sh --popup"
bind i run-shell "~/repos/dotfiles/util-scripts/tmux-claude-picker.sh --popup"

# Claude conversation summaries popup - current project's summaries.log (Cmd+e u)
bind u display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "~/repos/dotfiles/util-scripts/tmux-claude-summaries.sh"

# Ghostty shader picker popup (prefix + S)
bind S run-shell "~/repos/dotfiles/util-scripts/tmux-shader-picker.sh"

# tmux theme picker popup (prefix + C-t): live preview, Enter saves, Esc reverts
bind C-t run-shell "~/repos/dotfiles/util-scripts/tmux-theme.sh --popup"

# Tips popup - manual trigger (prefix + I for "info")
bind t run-shell "~/repos/dotfiles/util-scripts/tmux-tips-popup.sh"

# Neovim popup (Ctrl+1) - was Ctrl+a, which collided with Claude Code's Ctrl+a
bind -n C-1 display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "nvim"

# Lazygit popup (Ctrl+s)
bind -n C-w display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"

# Clean shell popup (Cmd+s -> Ctrl+s) - fresh zsh in the current path
bind -n C-s display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "zsh"

# ==========================
# TMUX Special modes
# ==========================

# Zen mode - distraction-free mode (prefix + Z)
bind Z run-shell "~/repos/dotfiles/util-scripts/tmux-zen-mode.sh"

# Cinema mode - transparent overlay for watching movies (prefix + V)
bind V run-shell "~/repos/dotfiles/util-scripts/tmux-cinema-mode.sh"

# ==========================
# Theme and appearance
# ==========================

# Colours live in config/tmux/themes/<name>.conf, applied after TPM (see the
# end of this file) by util-scripts/tmux-theme.sh. Switch with prefix + C-t.

# ==========================
# TPM Plugin Manager
# ==========================

# Set plugin path (required for headless plugin installation)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'brendandebeasi/tabby'

# Command Pallete
set -g @plugin "eduwass/tmux-palette"
set -g @palette-key 'C-p'   # optional, default: C-Space (no-prefix)

# Floating window
# set -g @plugin 'omerxx/tmux-floax'

# Color tag
# set -g @plugin 'Determinant/tmux-colortag'

# Themes are not plugins: see config/tmux/themes/ and the prefix + C-t picker.

# ==========================
# Plugin Configuration
# ==========================

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save-shell-history 'on'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# New packages
set -g @plugin "datamadsen/nunchux"
set -g @nunchux-key 'g'   # prefix+g; default C-Space is intercepted by macOS input-source switching
set -g @plugin "alexwforsythe/tmux-which-key"
set -g @plugin "anghootys/tmux-ip-address"
set -g @plugin "christoomey/vim-tmux-navigator"

# Floax settings
# set -g @floax-width '80%'
# set -g @floax-height '80%'
# set -g @floax-border-color 'magenta'
# set -g @floax-text-color 'blue'
# set -g @floax-bind 'f'
# set -g @floax-bind-menu 'F'

# ==========================
# Key Bindings
# ==========================

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Toggle synchronize panes
bind e setw synchronize-panes

# Resume THIS pane's claude session (prefix + R): `cres` scrapes the pane's
# scrollback for the `claude --resume "<name>"` quit hint. send-keys so the
# shell function is available (it wouldn't be in run-shell).
bind R send-keys "cres" Enter

# Restart tmux without losing claude sessions (prefix + C-q, or prefix + M-q).
# Flow: /exit every claude pane (each prints its `claude --resume <id>` hint)
# -> tmux-resurrect save (pane contents now include the hint) -> kill-server.
# Afterwards: `start` restores the layout, then prefix+R per pane runs `cres`.
# Ghostty forwards cmd+q as \x11 (= C-q), so `prefix, cmd+q` lands here too.
# Note: `prefix q` and no-prefix `C-q` stay bound to the claude popup.
# Fork THIS pane's claude session into a new side-by-side pane (prefix + B):
# prompts for a name, then types `cdang --resume <id> --fork-session -n <name>`
# into the new pane. See util-scripts/tmux-claude-fork.sh.
# Quoting: the name is never spliced into a quoted string (a ' or " in it would
# break the parse, and run-shell hands its text to sh). %%% escapes it into a
# pane option; #{q:...} then sh-escapes it for run-shell; the option is unset
# once the (blocking) run-shell returns.
bind B command-prompt -p "Fork claude session as:" "set -p @claude_fork_name \"%%%\" ; run-shell '~/repos/dotfiles/util-scripts/tmux-claude-fork.sh #{pane_id} #{q:@claude_fork_name}' ; set -pu @claude_fork_name"

bind C-q confirm-before -p "Exit all Claude sessions, save layout and kill tmux server? (y/n)" "run-shell -b '~/repos/dotfiles/util-scripts/tmux-restart.sh'"
bind M-q confirm-before -p "Exit all Claude sessions, save layout and kill tmux server? (y/n)" "run-shell -b '~/repos/dotfiles/util-scripts/tmux-restart.sh'"
# Single-pane test of the restart flow (prefix + X): /exit only THIS pane's
# claude, no save, no kill-server. Follow with prefix+R to check cres resumes it.
bind X confirm-before -p "Exit claude in this pane cleanly? (y/n)" "run-shell -b '~/repos/dotfiles/util-scripts/tmux-restart.sh --pane #{pane_id}'"

# New session (prompts for name, then creates and switches to it).
# Plain new-session switches the invoking client itself, so the name is used
# once: tmux substitutes only the FIRST %% in a template, and a second one
# (the old switch-client -t '%%') stayed literal. %%% escapes quotes in the name.
bind N command-prompt -p "New session name:" "new-session -s \"%%%\""

# Quick pane cycling
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fit the window to its client (prefix+F).
# tmux applies a saved layout verbatim: if its size differs from the window the
# pane stays undersized and tmux dots the rest of the window. resize-window -A
# snaps it back; the resurrect hook does the same for every restored window.
bind F resize-window -A \; display-message "Window fitted to client"
# After the resize, resume the claude session each restored pane was running
# before a crash / power loss (backgrounded: it waits for the shells to start).
# Off switch: set -g @claude-relaunch off. See util-scripts/tmux-claude-relaunch.sh.
set -g @resurrect-hook-post-restore-all 'tmux list-windows -a -F "#{window_id}" | xargs -n1 tmux resize-window -A -t; ~/repos/dotfiles/util-scripts/tmux-claude-relaunch.sh > /dev/null 2>&1 & [ -x ~/repos/dotfiles/util-scripts/rc-start.sh ] && { d="${XDG_STATE_HOME:-$HOME/.local/state}/claude-rc"; mkdir -p "$d" && { date "+%F %T post-restore"; ~/repos/dotfiles/util-scripts/rc-start.sh --if-listed; } >> "$d/restore.log" 2>&1; } &'

# Display pane numbers (press number to jump to pane)
bind p display-panes

# Rename pane title (prefix + T)
bind-key T command-prompt -p "Pane title:" 'select-pane -T "%%"'

# Swap current pane with selected pane (shows numbers for 5 sec)
bind m display-panes -d 5000 "swap-pane -t '%%'"

# ==========================
# Tips Timer Hook
# ==========================
# Start background timer on session creation (shows tips every 10 minutes)
set-hook -g session-created 'run-shell "~/repos/dotfiles/util-scripts/tmux-tips-timer.sh &"'

# ==========================
# Initialize TPM
# ==========================
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
# run 'tpack init'

# Colour theme (after TPM so no plugin can clobber it; re-run on every reload).
# Every theme's status-right carries continuum_save.sh: continuum's autosave
# (and with it the Claude crash relaunch) only runs while that string is there.
# Plain run-shell (no -b) blocks, so the theme is in place before the first draw.
run-shell '~/repos/dotfiles/util-scripts/tmux-theme.sh apply-saved'

# Custom pane title bar, off so dividers follow the theme (see Window Management):
# set -g pane-border-status top
# set -g pane-border-format " #[bold]#{pane_index}#[nobold] #{pane_current_path} | #{pane_title} "
# set -g pane-border-lines double

