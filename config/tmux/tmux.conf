############################################
# TMUX Configuration with TPM and Plugins #
############################################

# ==========================
# General Settings
# ==========================

# Use Ctrl+e as prefix (based on running config)
set -g prefix C-e
unbind C-b
bind C-e send-prefix

# Meta prefix: M-e (Alt+E on Linux, Option+E on macOS, Cmd+E once Ghostty
# emits meta). Portable across emulators/TTY — semantics live here, not in
# the terminal emulator.
set -g prefix2 M-e
bind M-e send-prefix

# Enable mouse support
set -g mouse on

# Set default terminal
set -g default-terminal "tmux-256color"

# Enable true color support
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable image passthrough for Kitty graphics protocol
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Increase history limit
set -g history-limit 50000

# Escape delay: NOT 0 — with 0, ESC+key arriving in separate reads (laggy
# SSH, TCP packetization) is split into bare Escape + char, which lands raw
# vi commands in pane shells. 25ms recombines meta pairs with headroom
# (upstream default is 10 since tmux 3.5) while keeping ESC feel instant.
set -g escape-time 25

# Disable Ctrl+d detach (conflicts with vim navigation)
unbind -n C-d

# Enable focus events
set -g focus-events on

# Increase display time
set -g display-time 4000

# Status refresh interval
set -g status-interval 1

# Set bar on top
set-option -g status-position top

# ==========================
# Copy Mode & Clipboard
# ==========================

# Vi-style copy keys
set -g mode-keys vi

# Enable clipboard
set -g set-clipboard on

# Copy-mode on "[" after prefix
bind -T prefix [ copy-mode
bind C-e copy-mode
# Meta mirror: prefix + M-e (Cmd+E Cmd+E / Alt+E Alt+E) = copy-mode
bind M-e copy-mode

# Scroll paging in copy-mode: M-u/M-d keep paging once inside
bind -T copy-mode-vi M-u send-keys -X page-up
bind -T copy-mode-vi M-d send-keys -X page-down

# macOS clipboard integration
if-shell 'uname | grep -q Darwin' {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# WSL clipboard integration
if-shell 'grep -q Microsoft /proc/version' {
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
  bind -T copy-mode     Enter send-keys -X copy-pipe-and-cancel "clip.exe"
  bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "clip.exe"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
}

# ==========================
# Pane Navigation (Vim-style)
# ==========================

# With prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Without prefix: vim-aware nav (vim-tmux-navigator pattern, manual binds —
# no TPM plugin needed; pairs with christoomey/vim-tmux-navigator in nvim).
# If the active pane runs (n)vim/fzf the key is passed through so nvim's own
# <C-h/j/k/l> / <A-h/j/k/l> maps handle the move; otherwise tmux switches pane.
# Ctrl family (native on all platforms) + Meta family (Alt on Linux,
# Option/Cmd on macOS) do the same thing.
#
# Guards are zero-fork format matches on #{pane_current_command} (no ps spawn
# per keypress). Meta keys additionally pass through when the pane runs ssh,
# so a remote box with these same dotfiles consumes them there instead of
# the local tmux hijacking the key. Requires tmux >= 3.1 (#{m/r:}).
is_vimlike='#{m/r:^(g?view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$,#{pane_current_command}}'
is_vimlike_or_ssh='#{m/r:^(g?view|l?n?vim?x?|fzf|ssh)(diff)?(-wrapped)?$,#{pane_current_command}}'
is_shell='#{m/r:^(-?(zsh|bash|sh|dash|ash))$,#{pane_current_command}}'
bind -n C-h if -F "$is_vimlike" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vimlike" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vimlike" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vimlike" 'send-keys C-l' 'select-pane -R'
bind -n M-h if -F "$is_vimlike_or_ssh" 'send-keys M-h' 'select-pane -L'
bind -n M-j if -F "$is_vimlike_or_ssh" 'send-keys M-j' 'select-pane -D'
bind -n M-k if -F "$is_vimlike_or_ssh" 'send-keys M-k' 'select-pane -U'
bind -n M-l if -F "$is_vimlike_or_ssh" 'send-keys M-l' 'select-pane -R'

# Scrollback: M-u enters copy-mode one page up (M-u/M-d then page within
# copy-mode — the copy-mode-vi table wins over these root binds once inside;
# q to exit). Passed through to nvim/ssh so they keep their own scrolling.
# M-d outside copy-mode is consumed as a deliberate no-op: an unhandled ESC+d
# in a vi-mode shell arms the delete operator (next 'd' wipes the line).
bind -n M-u if -F "$is_vimlike_or_ssh" 'send-keys M-u' 'copy-mode -u'
bind -n M-d if -F "$is_vimlike_or_ssh" 'send-keys M-d' ''

# Shell-key translations: tmux is the single brain — the shells have NO meta
# bindings (see zshrc/bashrc: auto-attach instead). Meta keys whose meaning
# lives in the line editor are translated to the Ctrl byte shells already
# understand natively, but ONLY when the foreground process is a shell;
# every other program receives the untouched meta key.
bind -n M-r if -F "$is_shell" 'send-keys C-r' 'send-keys M-r'

# Hazard caps: with Ghostty key-remap (super=alt) every Cmd+letter emits
# ESC+char, and an unbound one falls through to the pane shell where vi-mode
# executes it (measured destructive: x deletes, s substitutes, c arms the
# change operator). Consume the destructive strays; pass through to vimlike.
bind -n M-x if -F "$is_vimlike_or_ssh" 'send-keys M-x' ''
bind -n M-s if -F "$is_vimlike_or_ssh" 'send-keys M-s' ''
bind -n M-c if -F "$is_vimlike_or_ssh" 'send-keys M-c' ''

# Pane splitting with better keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ==========================
# Window Management
# ==========================

# Style panes borders (base - overrides after TPM below)
set -g pane-active-border-style fg=colour208,bg=default
set -g pane-border-lines double

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Navigate to previous/next window with Cmd+[ and ] (Ghostty sends Shift+Arrow sequences)
bind -n S-Left previous-window
bind -n S-Right next-window

# Move window left/right with Cmd+Shift+[ and ] (Ghostty sends Ctrl+Shift+Arrow sequences)
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# Switch sessions with Cmd+Shift+j/k (Ghostty sends Shift+Arrow sequences)
bind -n S-Down switch-client -n
bind -n S-Up switch-client -p

# Chord-only meta keys: consumed at root with a visible hint instead of a
# silent no-op, so "key does nothing" stays distinguishable from "binding
# broken". Passed through to vimlike/ssh panes.
bind -n M-i if -F "$is_vimlike_or_ssh" 'send-keys M-i' 'display-message "M-i is a prefix chord: press C-e/M-e first (Claude picker)"'
bind -n M-n if -F "$is_vimlike_or_ssh" 'send-keys M-n' 'display-message "M-n is a prefix chord: press C-e/M-e first (Claude popup)"'

# ==========================
# Pop ups
# ==========================
# INVARIANT: popups must never host a bare interactive vi-mode shell.
# While a display-popup job runs, ALL keys bypass every tmux key table and
# hit the popup pty raw (popup.c) — tmux cannot protect a shell inside one.
# Popups may host programs (claude, nvim, lazygit, fzf) or a NESTED tmux
# session (which brings this config's bindings with it), never a plain zsh.

# Help & Ask Claude menu (Cmd+e ?)
bind ? run-shell "~/repos/dotfiles/util-scripts/tmux-ask-menu.sh"

# Claude popup toggle (Ctrl+q / Alt+q, or prefix+Ctrl+n / prefix+Alt+n / prefix+q)
bind -n C-q run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"
bind -n M-q run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"
bind C-n run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"
bind M-n run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"
bind q run-shell "~/repos/dotfiles/util-scripts/tmux-claude-popup.sh"

# Claude pane picker - fzf list of running Claudes, Enter jumps to the pane (Cmd+e Cmd+i / Cmd+e i)
bind C-i display-popup -E -x 100% -y 0 -w 80% -h 70% "~/repos/dotfiles/util-scripts/tmux-claude-picker.sh"
bind M-i display-popup -E -x 100% -y 0 -w 80% -h 70% "~/repos/dotfiles/util-scripts/tmux-claude-picker.sh"
bind i display-popup -E -x 100% -y 0 -w 80% -h 70% "~/repos/dotfiles/util-scripts/tmux-claude-picker.sh"

# Claude conversation summaries popup - current project's summaries.log (Cmd+e u)
bind u display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "~/repos/dotfiles/util-scripts/tmux-claude-summaries.sh"

# Ghostty shader picker popup (prefix + S)
bind S run-shell "~/repos/dotfiles/util-scripts/tmux-shader-picker.sh"

# Tips popup - manual trigger (prefix + I for "info")
bind t run-shell "~/repos/dotfiles/util-scripts/tmux-tips-popup.sh"

# Neovim scratch popup (Ctrl+a / Alt+a)
bind -n C-a display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "nvim"
bind -n M-a display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "nvim"

# Lazygit popup (Ctrl+w / Alt+w)
bind -n C-w display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind -n M-w display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"

# Clean shell popup (Cmd+s -> Ctrl+s) - scratch shell in the current path,
# run as a nested tmux session (toggle-popup pattern) so the popup shell is
# covered by this config's key tables — see the popup INVARIANT above.
bind -n C-s display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "TMUX='' tmux new-session -A -s scratch -c '#{pane_current_path}'"

# ==========================
# TMUX Special modes
# ==========================

# Zen mode - distraction-free mode (prefix + Z)
bind Z run-shell "~/repos/dotfiles/util-scripts/tmux-zen-mode.sh"

# Cinema mode - transparent overlay for watching movies (prefix + V)
bind V run-shell "~/repos/dotfiles/util-scripts/tmux-cinema-mode.sh"

# ==========================
# Theme and appearance
# ==========================

# These will be overridden by tmux-power theme, but set defaults
set -g status-bg '#262626'
set -g status-fg '#626262'
set -g message-style "fg=#ffb86c,bg=#262626"
set -g message-command-style "fg=#ffb86c,bg=#262626"
set -g display-panes-active-colour '#ffb86c'
set -g display-panes-colour '#444444'

# ==========================
# TPM Plugin Manager
# ==========================

# Set plugin path (required for headless plugin installation)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Gruvbox theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # or 'light'

# Session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Floating window
# set -g @plugin 'omerxx/tmux-floax'

# Color tag
# set -g @plugin 'Determinant/tmux-colortag'

# Alternative themes (currently not active)
# set -g @plugin 'wfxr/tmux-power'
# set -g @tmux_power_theme 'gold'
# set -g @plugin 'catppuccin/tmux'

# ==========================
# Plugin Configuration
# ==========================

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save-shell-history 'on'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Floax settings
# set -g @floax-width '80%'
# set -g @floax-height '80%'
# set -g @floax-border-color 'magenta'
# set -g @floax-text-color 'blue'
# set -g @floax-bind 'f'
# set -g @floax-bind-menu 'F'

# ==========================
# Key Bindings
# ==========================

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Toggle synchronize panes
bind e setw synchronize-panes

# Resume THIS pane's claude session (prefix + R): `cres` scrapes the pane's
# scrollback for the `claude --resume "<name>"` quit hint. send-keys so the
# shell function is available (it wouldn't be in run-shell).
bind R send-keys "cres" Enter

# New session (prompts for name, then creates and switches to it)
bind N command-prompt -p "New session name:" "new-session -d -s '%%'; switch-client -t '%%'"

# M-h/j/k/l pane nav lives in the vim-aware block (Pane Navigation section)

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Display pane numbers (press number to jump to pane)
bind p display-panes

# Rename pane title (prefix + T)
bind-key T command-prompt -p "Pane title:" 'select-pane -T "%%"'

# Swap current pane with selected pane (shows numbers for 5 sec)
bind m display-panes -d 5000 "swap-pane -t '%%'"

# ==========================
# Tips Timer Hook
# ==========================
# Start background timer on session creation (shows tips every 10 minutes)
set-hook -g session-created 'run-shell "~/repos/dotfiles/util-scripts/tmux-tips-timer.sh &"'

# ==========================
# Initialize TPM
# ==========================
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
# run 'tpack init'

# Post-theme overrides (must be after TPM to avoid theme clobbering)
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#504945,fg=#bdae93,nobold,noitalics,nounderscore]#[bg=#bdae93,fg=#3c3836] #h"

set -g pane-border-status top
set -g pane-border-format " #[bold]#{pane_index}#[nobold] #{pane_current_path} | #{pane_title} "
set -g pane-active-border-style fg=colour208,bg=default
set -g pane-border-lines double

